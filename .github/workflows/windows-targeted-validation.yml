name: Windows Targeted Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Compile patched geolocation path and test launcher
    runs-on: windows-2022
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate patch structure and compatibility
        shell: pwsh
        run: |
          python research/validate_fp_patches.py
          python research/validate_patch_application.py
          python -m py_compile build.py research/validate_fp_patches.py

      - name: Prepare Chromium build environment
        uses: ./.github/actions/prepare
        with:
          python-version: '3.12'

      - name: Ensure Chromium download cache directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path 'C:\ungoogled-chromium-windows\build\download_cache' | Out-Null

      - name: Restore Chromium download cache
        id: download-cache
        uses: actions/cache@v5
        with:
          path: C:\ungoogled-chromium-windows\build\download_cache
          key: chromium-downloads-v1-${{ runner.os }}-${{ hashFiles('downloads.ini', 'ungoogled-chromium/downloads.ini', 'ungoogled-chromium/revision.txt') }}
          restore-keys: |
            chromium-downloads-v1-${{ runner.os }}-

      - name: Compile patched Chromium geolocation permission object
        shell: pwsh
        working-directory: C:\ungoogled-chromium-windows
        run: >
          python build.py --ci -j 1
          --target obj\components\permissions\permissions\geolocation_permission_context.obj

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore, build, and test Windows launcher
        shell: pwsh
        run: |
          dotnet restore src/FpBrowserLauncher/FpBrowserLauncher.csproj
          dotnet restore tests/FpBrowserLauncher.Tests/FpBrowserLauncher.Tests.csproj
          dotnet build tests/FpBrowserLauncher.Tests/FpBrowserLauncher.Tests.csproj -c Release --no-restore
          dotnet test tests/FpBrowserLauncher.Tests/FpBrowserLauncher.Tests.csproj -c Release --no-build --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-targeted-test-results
          path: TestResults
