name: reusable-build
on:
  workflow_call:
    inputs:
      python-version:
        type: string
        required: false
        default: '3.12'
      x86:
        type: boolean
        required: false
        default: false
      arm:
        type: boolean
        required: false
        default: false
      build-jobs:
        type: string
        required: false
        default: '1'

jobs:
  build-1:
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
      - name: Prepare
        uses: ./.github/actions/prepare
        with:
          python-version: ${{ inputs.python-version }}
      - name: Ensure Chromium download cache directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path 'C:\ungoogled-chromium-windows\build\download_cache' | Out-Null
      - name: Restore Chromium download cache
        id: download-cache
        uses: actions/cache@v5
        with:
          path: C:\ungoogled-chromium-windows\build\download_cache
          key: chromium-downloads-v1-${{ runner.os }}-${{ hashFiles('downloads.ini', 'ungoogled-chromium/downloads.ini', 'ungoogled-chromium/revision.txt') }}
          restore-keys: |
            chromium-downloads-v1-${{ runner.os }}-
      - name: Report download cache status
        shell: pwsh
        run: Write-Host "download_cache exact hit = ${{ steps.download-cache.outputs.cache-hit }}"
      - name: Run Stage
        id: stage
        uses: ./.github/actions/stage
        with:
          finished: false
          from_artifact: false
          x86: ${{ inputs.x86 }}
          arm: ${{ inputs.arm }}
          build-jobs: ${{ inputs.build-jobs }}
          stage: 1
    outputs:
      finished: ${{ steps.stage.outputs.finished }}
  build-2:
    needs: build-1
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        if: ${{ needs.build-1.outputs.finished != 'true' }}
        with:
          submodules: 'recursive'
      - name: Prepare
        if: ${{ needs.build-1.outputs.finished != 'true' }}
        uses: ./.github/actions/prepare
        with:
          python-version: ${{ inputs.python-version }}
      - name: Run Stage
        if: ${{ needs.build-1.outputs.finished != 'true' }}
        id: stage
        uses: ./.github/actions/stage
        with:
          finished: ${{ join(needs.*.outputs.finished) }}
          from_artifact: true
          x86: ${{ inputs.x86 }}
          arm: ${{ inputs.arm }}
          build-jobs: ${{ inputs.build-jobs }}
          stage: 2
    outputs:
      finished: ${{ needs.build-1.outputs.finished == 'true' || steps.stage.outputs.finished == 'true' }}
  build-3:
    needs: build-2
    runs-on: windows-2022
