name: Prepare Build Environment
description: Set up Python and copy the workspace to a short Windows path
inputs:
  python-version:
    description: Python version
    required: false
    default: '3.12'
runs:
  using: composite
  steps:
    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install depot_tools Python dependencies
      shell: pwsh
      run: python -m pip install --disable-pip-version-check --no-input "httplib2>=0.22,<1"

    - name: Init
      shell: pwsh
      run: |
        $source = $env:GITHUB_WORKSPACE
        $target = 'C:\ungoogled-chromium-windows'
        New-Item -ItemType Directory -Force -Path $target | Out-Null
        robocopy $source $target /E /COPY:DAT /DCOPY:DAT /R:2 /W:5 /NFL /NDL /NP /XD (Join-Path $source '.git') (Join-Path $source '.github')
        if ($LASTEXITCODE -gt 7) { exit $LASTEXITCODE }
        exit 0
