name: FP Launcher Build

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration
        required: true
        default: Release
        type: choice
        options:
          - Release
          - Debug

jobs:
  build-test-publish:
    name: Build, test, and publish launcher
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate fingerprint patch structure
        shell: pwsh
        run: python research/validate_fp_patches.py

      - name: Validate Chromium 151 patch application
        shell: pwsh
        run: python research/validate_patch_application.py

      - name: Prepare Chromium build environment
        uses: ./.github/actions/prepare
        with:
          python-version: '3.12'

      - name: Ensure Chromium download cache directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path 'C:\\ungoogled-chromium-windows\\build\\download_cache' | Out-Null

      - name: Restore Chromium download cache
        id: download-cache
        uses: actions/cache@v5
        with:
          path: C:\\ungoogled-chromium-windows\\build\\download_cache
          key: chromium-downloads-v1-${{ runner.os }}-${{ hashFiles('downloads.ini', 'ungoogled-chromium/downloads.ini', 'ungoogled-chromium/revision.txt') }}
          restore-keys: |
            chromium-downloads-v1-${{ runner.os }}-

      - name: Compile patched Chromium geolocation permission object
        shell: pwsh
        working-directory: C:\\ungoogled-chromium-windows
        run: >
          python build.py --ci -j 1
          --target obj\\components\\permissions\\permissions\\geolocation_permission_context.obj

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore app
        run: dotnet restore src/FpBrowserLauncher/FpBrowserLauncher.csproj

      - name: Restore tests
        run: dotnet restore tests/FpBrowserLauncher.Tests/FpBrowserLauncher.Tests.csproj

      - name: Build tests
        run: dotnet build tests/FpBrowserLauncher.Tests/FpBrowserLauncher.Tests.csproj -c ${{ inputs.configuration }} --no-restore

      - name: Run tests
        run: dotnet test tests/FpBrowserLauncher.Tests/FpBrowserLauncher.Tests.csproj -c ${{ inputs.configuration }} --no-build --logger trx --results-directory TestResults

      - name: Publish win-x64 app
        run: dotnet publish src/FpBrowserLauncher/FpBrowserLauncher.csproj -c ${{ inputs.configuration }} -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o artifacts/FpBrowserLauncher-win-x64

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fp-launcher-test-results
          path: TestResults

      - name: Upload launcher artifact
        uses: actions/upload-artifact@v4
        with:
          name: FpBrowserLauncher-win-x64
          path: artifacts/FpBrowserLauncher-win-x64
